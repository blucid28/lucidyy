<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUCID | Lookbook 2026</title>
    <style>
        :root {
            --text: #1a3a5a;
            --sky: #e0f2fe;
            --pink: #fce4ec;
            --glass: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Apple SD Gothic Neo', sans-serif; }
        body { background-color: #ffffff; color: var(--text); overflow-x: hidden; }

        /* 배경 (메인과 통일감) */
        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(at 0% 0%, var(--sky) 0, transparent 50%),
                        radial-gradient(at 100% 0%, var(--pink) 0, transparent 50%);
            background-size: 200% 200%; animation: meshFlow 15s ease infinite alternate;
        }
        @keyframes meshFlow { 0% { background-position: 0% 0%; } 100% { background-position: 100% 100%; } }

        nav {
            position: fixed; top: 0; width: 100%; padding: 30px 8%;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        .logo { font-size: 1.4rem; font-weight: 900; letter-spacing: 4px; text-decoration: none; color: var(--text); }
        .close-btn { text-decoration: none; color: var(--text); font-weight: 800; font-size: 0.8rem; letter-spacing: 2px; }

        .header { padding: 180px 8% 60px; text-align: center; }
        .header h1 { font-size: 5rem; font-weight: 900; letter-spacing: -2px; }

        .container { padding: 0 8% 100px; display: flex; flex-direction: column; gap: 100px; align-items: center; }
        
        /* 룩북 이미지 카드 */
        .look-card { width: 100%; max-width: 1000px; position: relative; }
        .img-box {
            width: 100%; height: 120vh;
            background-size: cover; background-position: center;
            border-radius: 40px; border: 1px solid white;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .look-card:hover .img-box { transform: scale(1.02); }
        
        .look-desc { margin-top: 20px; display: flex; justify-content: space-between; padding: 0 10px; }
        .look-desc h2 { font-size: 1.5rem; font-weight: 700; }

        /* 애니메이션 */
        .reveal { opacity: 0; transform: translateY(60px); transition: 1.2s; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        footer { padding: 80px 8%; text-align: center; opacity: 0.4; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    
    <nav>
        <a href="index.html" class="logo">BLUCID</a>
        <a href="index.html" class="close-btn">CLOSE [X]</a>
    </nav>

    <div class="header">
        <h1 class="reveal">LOOKBOOK</h1>
        <p class="reveal" style="letter-spacing: 8px; opacity: 0.5;">EDITORIAL SS 2026</p>
    </div>

    <div class="container">
        <div class="look-card reveal">
            <div class="img-box" style="background-image: url('look1.jpg');"></div>
            <div class="look-desc">
                <h2>01_The Lucid Ray</h2>
                <span>SPRING EDITION</span>
            </div>
        </div>

        <div class="look-card reveal">
            <div class="img-box" style="background-image: url('look2.jpg');"></div>
            <div class="look-desc">
                <h2>02_Airy Texture</h2>
                <span>CONCEPT PIECE</span>
            </div>
        </div>
    </div>

    <footer>© 2026 BLUCID STUDIO.</footer>

    <script>
        const reveal = () => {
            document.querySelectorAll('.reveal').forEach(el => {
                if (el.getBoundingClientRect().top < window.innerHeight - 50) el.classList.add('active');
            });
        };
        window.addEventListener('scroll', reveal);
        window.addEventListener('load', reveal);
    </script>
</body>
</html>
